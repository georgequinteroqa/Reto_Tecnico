# Configuración de Serenity BDD (lineamientos 7.4 y 8.14).
serenity {
  project.name = "Reto Técnico SQA - HU-001 Selección de fecha"
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
}

headless.mode = false

webdriver {
  driver = chrome
  autodownload = true
  timeouts.implicitlywait = 5000
  wait.for.timeout = 10000
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "incognito", "disable-popup-blocking", "remote-allow-origins=*", "disable-gpu", "window-size=1920,1080"]
    }
  }
}

# Selección de ambiente con -Denvironment=<nombre> (por defecto: default).
environments {
  default {
    webdriver.base.url = "https://jqueryui.com"
  }
  qa {
    webdriver.base.url = "https://jqueryui.com"
  }
}
