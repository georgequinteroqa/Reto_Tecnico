/*
 * Automatización HU-001: selección de fecha en un campo de formulario (jQuery UI Datepicker).
 * Patrón Screenplay con Serenity BDD, Cucumber (Gherkin en español) y Gradle.
 */
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Reporte compacto de una sola página (lineamiento 8.1.6).
        classpath 'net.serenity-bdd:serenity-single-page-report:4.2.34'
    }
}

plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.2.34'
    id 'org.sonarqube' version '6.3.1.5724'
}

group = 'co.com.sqasa'
version = '1.0.0'

ext {
    serenityVersion = '4.2.34'
    cucumberVersion = '7.22.2'
    junitVersion = '4.13.2'
    assertjVersion = '3.27.3'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"

    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-junit:${serenityVersion}"
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "junit:junit:${junitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation 'org.slf4j:slf4j-simple:2.0.16'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

serenity {
    // Árbol de requerimientos por módulo/épica dentro de features/ (lineamiento 8.1.6).
    requirementsBaseDir = 'src/test/resources/features'
    reports = ['single-page-html']
}

// Lineamiento 8.1.7: limpiar reportes previos antes de ejecutar.
tasks.register('limpiarReportesSerenity', Delete) {
    group = 'serenity'
    description = 'Elimina los reportes y descargas de ejecuciones anteriores.'
    delete 'target/site/serenity', 'target/site/serenity-report.zip', 'target/descargas'
}

test {
    // Lineamiento 8.1.1: solo JUnit 4 (runners de Cucumber con Serenity), sin mezclar plataformas.
    useJUnit()
    // Lineamiento 8.1.3: propagar opciones de Cucumber (tags, plugins) con -Dcucumber.filter.tags=...
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('cucumber.') || it.key.toString().startsWith('webdriver.') || it.key.toString() == 'headless.mode' || it.key.toString() == 'environment' }
    // Lineamiento 8.1.4: ejecución secuencial.
    maxParallelForks = 1
    // Lineamiento 8.1.2: reportes XML para CI y HTML para lectura.
    reports {
        junitXml.required = true
        html.required = true
    }
    // Lineamiento 8.1.5: trazas completas.
    testLogging {
        exceptionFormat = 'full'
        events 'passed', 'skipped', 'failed'
    }
    dependsOn 'limpiarReportesSerenity'
    finalizedBy 'aggregate', 'reports'
}

// Lineamiento 8.1.9: empaquetar el reporte para compartirlo.
tasks.register('zipSerenityReport', Zip) {
    group = 'reporting'
    description = 'Empaqueta el reporte de Serenity en target/site/serenity-report.zip.'
    from 'target/site/serenity'
    archiveFileName = 'serenity-report.zip'
    destinationDirectory = file('target/site')
}

// Lineamiento 8.1.10: verificar que el reporte exista.
tasks.register('verificarReporteSerenity') {
    group = 'reporting'
    description = 'Verifica que exista target/site/serenity/index.html.'
    doLast {
        def reporte = file('target/site/serenity/index.html')
        if (reporte.exists()) {
            logger.lifecycle("Reporte de Serenity OK: ${reporte}")
        } else {
            throw new GradleException('No se encontró el reporte de Serenity. Ejecute: gradlew test aggregate')
        }
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'reto-tecnico-datepicker'
        property 'sonar.projectName', 'Reto Técnico SQA - HU-001 Datepicker'
        property 'sonar.sourceEncoding', 'UTF-8'
    }
}
